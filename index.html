<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1226C8">
<title>Niehl Nord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#1226C8; --paper:#F4F5FF; --dim:rgba(244,245,255,.55); }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--blue);color:var(--paper);
    font-family:'Barlow Condensed',system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    min-height:100dvh;
    padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;justify-content:center;gap:.4rem;
  }
  .now{
    font-weight:800;font-size:clamp(9rem,62vw,20rem);line-height:.72;
    letter-spacing:-.03em;
  }
  .now span{font-size:.16em;letter-spacing:0;margin-left:.1em}
  .sub{font-weight:600;font-size:2.1rem;color:var(--dim);margin-bottom:1.8rem}
  .row{
    display:flex;align-items:baseline;gap:.9rem;
    font-weight:800;font-size:clamp(3.4rem,18vw,5.5rem);line-height:1.1;
  }
  .row em{font-style:normal;font-weight:600;font-size:.42em;color:var(--dim)}
  .msg{font-weight:600;font-size:1.8rem;line-height:1.2;max-width:16ch}
  .flip{
    margin-top:2rem;background:none;border:0;padding:.4rem 0;
    font-family:inherit;font-weight:600;font-size:1.15rem;
    color:var(--dim);cursor:pointer;text-align:left;
  }
  .flip:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div id="board">
  <div class="now" id="now">–</div>
  <div class="sub" id="sub"></div>
  <div id="rest"></div>
</div>
<div class="msg" id="msg">lädt …</div>

<button class="flip" id="flip">→ Merkenich</button>

<script>
const STOP='de-DELFI_de:05315:15411:1:11';
const API=`https://api.transitous.org/api/v1/stoptimes?stopId=${encodeURIComponent(STOP)}&n=25&mode=TRAM`;
let dir='Zollstock';
const $=id=>document.getElementById(id);
const hhmm=d=>new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}).format(d);

async function load(){
  try{
    const r=await fetch(API+'&_='+Date.now());
    if(!r.ok) throw 0;
    show(((await r.json()).stopTimes)||[]);
  }catch(e){
    $('board').hidden=true;$('msg').hidden=false;
    $('msg').textContent='keine Verbindung — nochmal antippen';
  }
}

function show(all){
  const now=Date.now();
  const runs=all
    .filter(s=>(s.headsign||'').includes(dir)&&!s.cancelled&&!s.tripCancelled)
    .map(s=>new Date(s.place.departure||s.place.scheduledDeparture))
    .filter(d=>d.getTime()>now-60000)
    .sort((a,b)=>a-b);

  if(!runs.length){
    $('board').hidden=true;$('msg').hidden=false;
    $('msg').textContent='gerade nichts Richtung '+dir;
    return;
  }
  $('msg').hidden=true;$('board').hidden=false;

  const m=Math.max(0,Math.round((runs[0]-now)/60000));
  $('now').innerHTML = m===0 ? 'jetzt' : m+'<span>min</span>';
  $('sub').textContent = hhmm(runs[0]);
  $('rest').innerHTML = runs.slice(1,4).map(d=>
    `<div class="row">${hhmm(d)} <em>in ${Math.round((d-now)/60000)}</em></div>`
  ).join('');
}

$('flip').onclick=()=>{
  dir = dir==='Zollstock' ? 'Merkenich' : 'Zollstock';
  $('flip').textContent = '→ ' + (dir==='Zollstock' ? 'Merkenich' : 'Zollstock');
  load();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(load,30000);
load();
</script>
</body>
</html>
